analysis:
  description: >
    Analyze current market conditions for the requested tokens.
    Fetch prices across chains and identify trends and opportunities.
  expected_output: Market analysis grounded in Suwappu tool results
  agent: analyst

risk_assessment:
  description: >
    Review the analysis and assess portfolio risk. Require a wallet address
    before requesting portfolio data, and identify what should be simulated.
  expected_output: Risk assessment, constraints, and simulation recommendations
  agent: risk_manager

trade_plan:
  description: >
    Build a plan from fresh quotes and simulate when a wallet address is
    available. Do not execute or broadcast unless the host explicitly enables
    managed execution for the run.
  expected_output: Trade plan with quote/simulation evidence and approval requirements
  agent: trader
