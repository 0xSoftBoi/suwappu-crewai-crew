[project]
name = "suwappu-crewai-crew"
version = "1.0.0"
description = "Multi-agent trading crew powered by CrewAI and Suwappu DEX"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["crewai", "suwappu", "trading", "multi-agent", "defi"]
dependencies = [
    "crewai>=0.80.0",
    "suwappu>=0.1.0",
    "pydantic>=2.0",
]

[project.scripts]
suwappu-crew = "src.crew:main"

[project.urls]
Homepage = "https://github.com/0xSoftBoi/suwappu-crewai-crew"
Repository = "https://github.com/0xSoftBoi/suwappu-crewai-crew"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
