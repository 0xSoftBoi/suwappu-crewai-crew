name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Compile source
        run: python -m compileall -q src
      - name: Import smoke test
        run: python -c "from src.crew import sanitize_query; assert sanitize_query('Analyze ETH') == 'Analyze ETH'"
